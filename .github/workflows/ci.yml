# Sprawdzenie każdego pusha i pull requesta: typy, testy jednostkowe, walidacja pytań, build i znane podatności zależności.
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Typy
        run: npm run typecheck
      - name: Testy jednostkowe
        run: npm test
      - name: Walidacja pytań
        run: npm run -s validate-questions
      - name: Build
        run: npx next build
      - name: Podatności zależności (produkcyjnych)
        run: npm audit --omit=dev --audit-level=high
