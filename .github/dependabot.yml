# Cotygodniowe aktualizacje zależności npm i akcji GitHub (poprawki bezpieczeństwa – od razu, zgodnie z ustawieniami repozytorium).
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      drobne:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
